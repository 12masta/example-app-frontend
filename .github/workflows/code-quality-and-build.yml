name: Code Quality and Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate API artifacts
        run: yarn generate

      - name: Lint
        run: yarn exec eslint src --ext ts,tsx --max-warnings=0

      - name: Run unit tests
        run: yarn test --ci --watchAll=false

      - name: Build production bundle
        run: yarn build:prod
